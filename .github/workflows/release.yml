name: Safe Deals Release AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_BASE64_CLEAN=$(printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]')

          case $((${#KEYSTORE_BASE64_CLEAN} % 4)) in
            2) KEYSTORE_BASE64_CLEAN="${KEYSTORE_BASE64_CLEAN}==" ;;
            3) KEYSTORE_BASE64_CLEAN="${KEYSTORE_BASE64_CLEAN}=" ;;
            1) echo "Invalid KEYSTORE_BASE64 length"; exit 1 ;;
          esac

          printf '%s' "$KEYSTORE_BASE64_CLEAN" | base64 --decode > android/app/upload-keystore.jks

          cat > android/key.properties <<EOT
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOT

      - name: Flutter dependencies
        run: flutter pub get

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Safe-Deals-release-AAB
          path: build/app/outputs/bundle/release/app-release.aab
